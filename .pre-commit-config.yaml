repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # Lint and format.  The hook entries carry `--force-exclude`, so the file
  # set stays stated once, in the `exclude` list in pyproject.toml.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Type check.  This hook checks the whole project rather than the staged
  # files, because an edit in one module can raise a diagnostic in another.
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.91
    hooks:
      - id: ty

  - repo: local
    hooks:
      - id: pytest-check
        name: pytest-check
        entry: .venv/bin/pytest
        language: system
        pass_filenames: false
        always_run: false
        stages: [manual]
